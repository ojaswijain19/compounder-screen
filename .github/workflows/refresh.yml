name: Refresh screen

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 22:30 UTC, after the US close, Mon–Fri
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Week key
        run: echo "WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - name: Restore SEC fundamentals (refreshed weekly)
        uses: actions/cache@v4
        with:
          path: scripts/facts
          key: sec-facts-${{ env.WEEK }}
      - name: Fetch SEC fundamentals
        run: python fetch_sec.py
      - name: Fetch prices
        run: python fetch_px.py
      - name: Compute scores
        env:
          PUBLIC: '1'
        run: python compute.py
      - name: Sanity check
        run: python check.py
      - name: Build site
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
