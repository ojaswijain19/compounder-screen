name: Refresh screen

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 22:30 UTC, after the US close, Mon–Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Week key
        run: echo "WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - name: Restore SEC fundamentals (refreshed weekly)
        uses: actions/cache@v4
        with:
          path: scripts/facts
          key: sec-facts-${{ env.WEEK }}-${{ github.run_id }}
          restore-keys: |
            sec-facts-${{ env.WEEK }}-
            sec-facts-
      - name: Fetch SEC fundamentals
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python fetch_sec.py
      - name: Fetch prices
        run: python fetch_px.py
      - name: Compute scores
        env:
          PUBLIC: '1'
        run: python compute.py
      - name: Sanity check
        run: python check.py
      - name: Build site
        run: python build_site.py
      - name: Publish to gh-pages branch
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Refresh $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
